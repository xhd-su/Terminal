<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal - xhd</title>
  
  <meta name="description" content="Interactive terminal-style portfolio of xhd. Cybersecurity, SOC, Linux, and personal projects.">
  <meta name="author" content="xhd">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="xhd | Interactive Terminal Portfolio">
  <meta property="og:description" content="Cybersecurity enthusiast – SOC, Linux, forensics. Explore my portfolio through a terminal interface.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://xhd-su.github.io/Terminal/">
  <meta property="og:image" content="https://xhd-su.github.io/Terminal/ye.jpg">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <style>
    /* Style général pour le terminal */
body {
  background-color: black;
  color: #00FF00;
  font-family: 'Courier New', monospace;
  font-size: 18px;
  margin: 0;
  padding: 0;
  position: relative;
  overflow: hidden;
}

/* Canvas pour les particules */
#particles-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
  opacity: 0;
  transition: opacity 0.5s ease;
}

#particles-canvas.active {
  opacity: 1;
}

.terminal {
  width: 92vw;
  height: 90vh;
  margin: 4vh auto;
  padding: clamp(12px, 2vw, 24px);
  display: flex;
  flex-direction: column;
  align-items: stretch;
  border: 2px solid #00FF00;
  border-radius: 10px;
  box-shadow: 0 0 15px #00FF00;
  background-color: #000;
  color: #00FF00;
  font-family: 'Courier New', Courier, monospace;
  font-size: clamp(13px, 1.6vw, 18px);
  position: relative;
  overflow: hidden;
  z-index: 1;
  transition: border 0.3s ease, box-shadow 0.3s ease;
  cursor: text;
  box-sizing: border-box;
}

/* Effet CRT discret : légères scanlines superposées */
.terminal::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0, 255, 0, 0.025) 0px,
    rgba(0, 255, 0, 0.025) 1px,
    transparent 1px,
    transparent 3px
  );
  pointer-events: none;
  z-index: 2;
  border-radius: 10px;
}

/* Léger halo qui s'intensifie quand on interagit avec le terminal */
.terminal:focus-within {
  box-shadow: 0 0 22px #00FF00;
}

/* Effet glitch */
.glitch {
  animation: glitch 0.3s ease;
}

@keyframes glitch {
  0% {
    transform: translate(0);
    filter: hue-rotate(0deg);
  }
  20% {
    transform: translate(-5px, 5px);
    filter: hue-rotate(90deg);
  }
  40% {
    transform: translate(-5px, -5px);
    filter: hue-rotate(180deg);
  }
  60% {
    transform: translate(5px, 5px);
    filter: hue-rotate(270deg);
  }
  80% {
    transform: translate(5px, -5px);
    filter: hue-rotate(360deg);
  }
  100% {
    transform: translate(0);
    filter: hue-rotate(0deg);
  }
}

@media (prefers-reduced-motion: reduce) {
  .glitch {
    animation: none;
  }
  #particles-canvas {
    display: none;
  }
}

#output {
  white-space: pre-wrap;
  word-wrap: break-word;
  max-width: 100%;
  max-height: 1000px;
  overflow-y: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

#output::-webkit-scrollbar {
  display: none;
}

pre {
  margin: 0;
}

.intro-text {
  font-style: italic;
}

.prompt {
  color: #00FF00;
  font-family: 'Courier New', monospace;
  font-weight: bold;
  font-size: 18px;
}

.output {
  color: #00FF00;
}

#output a {
  color: #00ff88;
  text-decoration: underline;
}

#output a:hover {
  color: #66ff66;
}

#input-wrapper {
  position: relative;
  flex-grow: 1;
  line-height: 1.5em;
}

#ghost {
  position: absolute;
  top: 0;
  left: 0;
  white-space: pre;
  font-family: 'Courier New', monospace;
  font-size: inherit;
  line-height: 1.5em;
  color: rgba(0, 255, 0, 0.38);
  pointer-events: none;
  user-select: none;
}

#command {
  position: relative;
  background: transparent;
  border: none;
  color: #00FF00;
  outline: none;
  font-family: 'Courier New', monospace;
  font-size: 18px;
  width: 100%;
  padding: 0;
  margin: 0;
  line-height: 1.5em;
}

#input-line {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
}

#input-line .prompt {
  line-height: 1.5em;
}

.cursor {
  display: inline-block;
  width: 10px;
  height: 1.5em;
  background-color: #00FF00;
  box-shadow: 0 0 8px #00FF00, 0 0 14px #00FF00;
  animation: blink 0.8s infinite;
}

@keyframes blink {
  50% { opacity: 0; }
}

/* Vue "page ouverte" : remplace output+input-line à l'intérieur du même cadre */
#page-view {
  display: none;
  flex-direction: column;
  width: 100%;
  flex: 1;
  min-height: 0;
  gap: 10px;
}

#page-view.active {
  display: flex;
}

#page-frame {
  flex: 1;
  width: 100%;
  min-height: 0;
  border: 1px solid #00FF00;
  border-radius: 6px;
  background: #000;
}

#frame-wrapper {
  position: relative;
  flex: 1;
  min-height: 0;
  width: 100%;
}

#frame-wrapper #page-frame {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
}

#frame-loading {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
  border: 1px solid #00FF00;
  border-radius: 6px;
  color: #00FF00;
  font-family: 'Courier New', monospace;
  font-size: 1.2em;
  letter-spacing: 1px;
  z-index: 3;
  transition: opacity 0.2s ease;
}

#frame-loading.hidden {
  opacity: 0;
  pointer-events: none;
}

#back-to-terminal {
  align-self: center;
  background: #000;
  color: #00FF00;
  border: 1px solid #00FF00;
  border-radius: 6px;
  padding: 8px 22px;
  font-family: 'Courier New', monospace;
  font-size: 15px;
  cursor: pointer;
  box-shadow: 0 0 8px #00FF00;
  transition: all 0.2s ease;
}

#back-to-terminal:hover {
  background: #00FF00;
  color: #000;
}

  </style>
</head>
<body>
  <canvas id="particles-canvas"></canvas>
  
  <div class="terminal">
    <pre id="output" aria-live="polite"></pre>
    <div id="input-line" style="display: none; width: 100%;">
      <span id="baseprompt" class="prompt">Terminal@guest:~# </span>
      <div id="input-wrapper">
        <div id="ghost" aria-hidden="true"></div>
        <input type="text" id="command" autofocus aria-label="Terminal command input">
      </div>
    </div>
    <div id="page-view">
      <div id="frame-wrapper">
        <iframe id="page-frame" title="Page intégrée"></iframe>
        <div id="frame-loading" class="hidden">
          <span id="loading-text">Loading...</span>
        </div>
      </div>
      <button id="back-to-terminal" type="button">← back to terminal</button>
    </div>
  </div>

  <noscript>
    <div style="font-family: monospace; color: #0f0; background:#000; padding:2rem; max-width:700px; margin:2rem auto;">
      <h1>xhd — Cybersecurity / SOC / Linux</h1>
      <p>This portfolio normally runs as an interactive terminal, but it requires JavaScript.</p>
      <p><a href="cv.pdf" style="color:#0f0;">Download my CV</a></p>
    </div>
  </noscript>
  
  <script>
    if (/Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
      window.location.href = "./mobile/index.html";
    }
    
    document.addEventListener("DOMContentLoaded", () => {
      const output = document.getElementById("output");
      const commandInput = document.getElementById("command");
      const terminal = document.querySelector(".terminal");
      const ghost = document.getElementById("ghost");
      const pageView = document.getElementById("page-view");
      const pageFrame = document.getElementById("page-frame");
      const backButton = document.getElementById("back-to-terminal");
      const frameLoading = document.getElementById("frame-loading");
      const loadingText = document.getElementById("loading-text");
      const canvas = document.getElementById("particles-canvas");
      const ctx = canvas.getContext("2d");

      // Confort d'usage : cliquer n'importe où dans le terminal focus l'input,
      // sauf si on sélectionne du texte dans l'output.
      terminal.addEventListener("click", () => {
        if (window.getSelection().toString().length === 0) {
          commandInput.focus();
        }
      });

      // Nom du repo GitHub Pages
      const githubBaseURL = "https://xhd-su.github.io/Terminal";

      // Affiche une page dans un iframe DANS le cadre du terminal, sans
      // jamais quitter index.html. Un bouton permet de revenir au shell.
      let spinnerInterval = null;
      const spinnerFrames = ["|", "/", "-", "\\"];

      function showLoading(label) {
        frameLoading.classList.remove("hidden");
        let i = 0;
        loadingText.textContent = `Loading ${label}... ${spinnerFrames[0]}`;
        clearInterval(spinnerInterval);
        spinnerInterval = setInterval(() => {
          i = (i + 1) % spinnerFrames.length;
          loadingText.textContent = `Loading ${label}... ${spinnerFrames[i]}`;
        }, 150);
      }

      function hideLoading() {
        clearInterval(spinnerInterval);
        frameLoading.classList.add("hidden");
      }

      pageFrame.addEventListener("load", hideLoading);

      function openInFrame(url, label) {
        showLoading(label);
        pageFrame.src = url;
        pageView.classList.add("active");
        document.getElementById("input-line").style.display = "none";
        output.style.display = "none";
      }

      function closeFrame() {
        pageView.classList.remove("active");
        pageFrame.src = "about:blank";
        hideLoading();
        output.style.display = "";
        document.getElementById("input-line").style.display = "flex";
        commandInput.focus();
        output.innerHTML += `<span class="output">[ Returned to terminal ]</span><br><br>`;
        setTimeout(() => {
          output.scrollTop = output.scrollHeight;
        }, 50);
      }

      backButton.addEventListener("click", closeFrame);

      // --- Sécurité : échappement HTML ---
      // Toute valeur qui provient de l'utilisateur (commande tapée, arguments)
      // DOIT passer par escapeHTML() avant d'être insérée via innerHTML.
      // Sans ça, taper par ex. <img src=x onerror=alert(1)> exécute du JS (XSS).
      function escapeHTML(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      // --- cowsay, version "chat" pour rester cohérent avec le thème du site ---
      function wrapText(text, width) {
        const words = text.split(/\s+/).filter(Boolean);
        const lines = [];
        let current = "";
        for (const word of words) {
          const candidate = current ? `${current} ${word}` : word;
          if (candidate.length > width) {
            if (current) lines.push(current);
            current = word;
          } else {
            current = candidate;
          }
        }
        if (current) lines.push(current);
        if (lines.length === 0) lines.push("");
        return lines;
      }

      function catsay(text) {
        const raw = (text && text.trim()) ? text.trim() : "Meow?";
        const lines = wrapText(raw, 40);
        const maxLen = Math.max(...lines.map(l => l.length));

        const top = " " + "_".repeat(maxLen + 2);
        const bottom = " " + "-".repeat(maxLen + 2);

        const body = lines.map((l, i) => {
          const padded = escapeHTML(l.padEnd(maxLen));
          if (lines.length === 1) return `&lt; ${padded} &gt;`;
          if (i === 0) return `/ ${padded} \\`;
          if (i === lines.length - 1) return `\\ ${padded} /`;
          return `| ${padded} |`;
        }).join("\n");

        return `<span class="output">${top}
${body}
${bottom}
        \\
         \\
           /\\_/\\
          ( o.o )
           &gt; ^ &lt;</span>`;
      }

      // --- stats : session (client) + compteur global partagé (CountAPI) ---
      function buildStats() {
        const uptimeSec = Math.floor((Date.now() - sessionStart) / 1000);
        const mins = Math.floor(uptimeSec / 60);
        const secs = uptimeSec % 60;
        const visitsLine = globalVisits !== null ? globalVisits : "unavailable";

        return `<span class="output">== session.stats ==
Session uptime : ${mins}m ${secs}s
Commands run   : ${commandsRun}
Root mode      : ${rootMode ? "active" : "inactive"}

== global.stats ==
Total visits (all-time) : ${visitsLine}
</span>`;
      }

      // Variables d'état
      let currentDirectory = "Terminal"; 
      const files = ["cv.pdf", "profile", "contact", "gym", "guestbook"];
      const directories = []; 
      const commandsList = ["ls", "cd", "open", "clear", "help", "sudo", "exit", "whoami", "tree", "cat", "cowsay", "stats", "message"];
      let rootMode = false;
      let awaitingSecretAnswer = false;

      // --- Stats de session (client-side) + compteur global partagé ---
      const sessionStart = Date.now();
      let commandsRun = 0;
      let globalVisits = null;

      // CountAPI : petit compteur public gratuit, sans clé, pensé pour ce
      // genre d'usage. En cas d'échec (service down), on affiche juste
      // "unavailable" au lieu de casser la page.
      async function fetchGlobalVisits() {
        try {
          const res = await fetch("https://api.countapi.xyz/hit/xhd-su-terminal/visits");
          const data = await res.json();
          globalVisits = data.value;
        } catch (e) {
          globalVisits = null;
        }
      }
      fetchGlobalVisits();
      
      // Historique des commandes
      let commandHistory = [];
      let historyIndex = -1;

      // Particules
      let particles = [];
      let animationId = null;

      // Setup canvas
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);

      // Redimensionnement dynamique du terminal : recalculé à chaque
      // changement réel de la fenêtre (resize, rotation, clavier virtuel...)
      // plutôt que de dépendre uniquement des unités CSS vw/vh, qui ne
      // tiennent pas compte des barres d'interface mobiles.
      function getViewportSize() {
        if (window.visualViewport) {
          return { w: window.visualViewport.width, h: window.visualViewport.height };
        }
        return { w: window.innerWidth, h: window.innerHeight };
      }

      function sizeTerminal() {
        const { w, h } = getViewportSize();
        const margin = Math.max(12, Math.min(w, h) * 0.02);
        terminal.style.margin = `${margin}px auto`;
        terminal.style.width = `${w - margin * 2}px`;
        terminal.style.height = `${h - margin * 2}px`;
      }

      sizeTerminal();
      window.addEventListener("resize", sizeTerminal);
      window.addEventListener("orientationchange", sizeTerminal);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", sizeTerminal);
      }

      // Classe Particule
      class Particle {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.vx = (Math.random() - 0.5) * 0.5;
          this.vy = (Math.random() - 0.5) * 0.5;
          this.size = Math.random() * 2 + 1;
          this.life = Math.random() * 100 + 100;
          this.maxLife = this.life;
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;
          this.life--;

          if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
          if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
        }

        draw() {
          const alpha = this.life / this.maxLife;
          ctx.fillStyle = `rgba(255, 0, 0, ${alpha * 0.6})`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        }

        isDead() {
          return this.life <= 0;
        }
      }

      function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Ajouter de nouvelles particules
        if (particles.length < 100) {
          particles.push(new Particle());
        }

        // Mettre à jour et dessiner
        particles = particles.filter(p => !p.isDead());
        particles.forEach(p => {
          p.update();
          p.draw();
        });

        animationId = requestAnimationFrame(animateParticles);
      }

      function startParticles() {
        canvas.classList.add("active");
        if (!animationId) {
          animateParticles();
        }
      }

      function stopParticles() {
        canvas.classList.remove("active");
        if (animationId) {
          cancelAnimationFrame(animationId);
          animationId = null;
          particles = [];
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      // Introduction avant le shell
      const introParts = [
        { content: `[ xhd v3.0 booting... ]`, speed: 15 },
        { content: `Initializing shell session... Please wait.`, speed: 15 },
        { content: `
 /\\_/\\   /\\_/\\   /\\_/\\   /\\_/\\   /\\_/\\   /\\_/\\
( o.o ) ( o.o ) ( o.o ) ( o.o ) ( o.o ) ( o.o )
 > ^ <   > ^ <   > ^ <   > ^ <   > ^ <   > ^ < 
 /\\_/\\                                   /\\_/\\
( o.o )            .__         .____    ( o.o )
 > ^ <     ___  ___|  |__    __| _/      > ^ < 
 /\\_/\\     \\  \\/  /|  |  \\  / __ |       /\\_/\\
( o.o )     >    < |   Y  \\/ /_/ |      ( o.o )
 > ^ <     /__/\\_ \\|___|  /\\____ |       > ^ < 
 /\\_/\\           \\/     \\/      \\/       /\\_/\\
( o.o )                                 ( o.o )
 > ^ <                                   > ^ < 
 /\\_/\\   /\\_/\\   /\\_/\\   /\\_/\\   /\\_/\\   /\\_/\\
( o.o ) ( o.o ) ( o.o ) ( o.o ) ( o.o ) ( o.o )
 > ^ <   > ^ <   > ^ <   > ^ <   > ^ <   > ^ < \n`,
          speed: 1
        },
        { content: `Welcome to xhd's terminal.`, speed: 15 },
        { content: `Type 'help' to display available commands.\nHope you are familiar with linux terminals :D`, speed: 15 }
      ];
      
      let currentPart = 0;
      let index = 0;
      let introDone = false;
      
      function typeWriterPart() {
        const part = introParts[currentPart];
        if (index < part.content.length) {
          // Contenu statique défini par nous-mêmes : pas besoin d'échapper ici,
          // mais on reste sur innerHTML+= puisque le contenu est fixe et sûr.
          output.innerHTML += part.content.charAt(index);
          index++;
          setTimeout(typeWriterPart, part.speed);
        } else {
          output.innerHTML += "\n\n";
          currentPart++;
          if (currentPart < introParts.length) {
            index = 0;
            setTimeout(typeWriterPart, 500);
          } else {
            introDone = true;
            document.getElementById("input-line").style.display = "flex";
            commandInput.disabled = false;
            commandInput.focus();
            setTimeout(() => {
              output.scrollTop = output.scrollHeight;
            }, 50);
          }
        }
      }
      
      commandInput.disabled = true;
      typeWriterPart();

      // Liste des commandes
      const commands = {
        ls: () => {
          if (currentDirectory === "Terminal") {
            const allDirs = [...directories];
            if (rootMode) allDirs.push("secret");
            return [...allDirs, ...files].join("  ");
          }
          return "Nothing Found.";
        },
        open: (args) => {
          if (!args[0]) return "Veuillez spécifier un fichier.";
          const name = args[0];
          const openTargets = {
            "cv.pdf": "cv.pdf",
            "profile": "profile/index.html",
            "contact": "contact/index.html",
            "gym": "gym/index.html",
            "guestbook": "guestbook/index.html"
          };
          if (currentDirectory === "Terminal" && openTargets[name]) {
            openInFrame(`${githubBaseURL}/${openTargets[name]}`, name);
            return `Opening ${escapeHTML(name)}...`;
          }
          return "404 File Not Found.";
        },
        cat: (args) => {
          if (!args[0]) return "Specify a file. Usage: cat &lt;file&gt;";
          const name = args[0];
          if (name === "cv.pdf") return "cat: cv.pdf: binary file (use 'open cv.pdf' instead).";
          if (files.includes(name)) return `cat: ${escapeHTML(name)}: use 'open ${escapeHTML(name)}' to view this file.`;
          return `cat: ${escapeHTML(name)}: No such file.`;
        },
        cowsay: (args) => catsay(args.join(" ")),
        stats: () => buildStats(),
        message: (args) => {
          const text = args.join(" ");
          if (!text) return "Usage: message &lt;text&gt;";

          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).catch(() => {
              output.innerHTML += `<span class="output">[ Clipboard copy failed — you'll need to type your message manually. ]</span><br><br>`;
            });
          }

          openInFrame(`${githubBaseURL}/guestbook/index.html`, "guestbook");
          return `Message copied to clipboard: "${escapeHTML(text)}"<br>Paste it in the box below and sign in with GitHub to post it.`;
        },
        cd: (args) => {
          if (!args[0]) return "Specify a directory.";
      
          if (args[0] === "secret" && rootMode) {
            output.innerHTML += `<span class="output">Wanna see my secret?</span><br>`;
            setTimeout(() => {
              window.location.href = `${githubBaseURL}/secret/index.html`;
            }, 1000);
            return "";
          }
      
          if (directories.includes(args[0])) {
            // args[0] est déjà validé contre la whitelist `directories`
            // (includes), donc sûr à insérer, mais on échappe quand même
            // par défense en profondeur.
            output.innerHTML += `<span class="output">Access to '${escapeHTML(args[0])}'...</span><br>`;
            setTimeout(() => {
              window.location.href = `${githubBaseURL}/${args[0]}/index.html`;
            }, 1000);
            return "";
          }
      
          return "Directory Not Found.";
        },
        clear: () => {
          output.innerHTML = "";
          return "";
        },
        whoami: () => {
          return rootMode ? "root" : "guest";
        },
        tree: () => {
          let tree = "Terminal/\n";
          const allDirs = [...directories];
          if (rootMode) allDirs.push("secret");
          
          allDirs.forEach((dir, i) => {
            const isLast = i === allDirs.length - 1 && files.length === 0;
            tree += `${isLast ? '└──' : '├──'} ${dir}/\n`;
          });
          
          files.forEach((file, i) => {
            const isLast = i === files.length - 1;
            tree += `${isLast ? '└──' : '├──'} ${file}\n`;
          });
          
          return tree;
        },
        exit: () => {
          if (!rootMode) return "You are not root.";
          
          // Effet glitch
          terminal.classList.add("glitch");
          setTimeout(() => terminal.classList.remove("glitch"), 300);
          
          rootMode = false;
          stopParticles();

          terminal.style.border = "2px solid green";
          terminal.style.boxShadow = "0 0 15px green";
          document.body.style.backgroundColor = "#000000";
          document.getElementById("baseprompt").textContent = "Terminal@guest:~# ";
        
          return "[ Root mode exited. You're back to normal user ]";
        },
        help: () => {
          return `
<strong>Available commands :</strong><br>
<span class="output">ls</span> - Displays files and directories in the current directory.<br>
<span class="output">cd <i>directory</i></span> - Change directory. Example: 'cd projects'.<br>
<span class="output">open <i>file</i></span> - Opens a file. Example: 'open cv.pdf'.<br>
<span class="output">cat <i>file</i></span> - Displays file content when available.<br>
<span class="output">cowsay <i>text</i></span> - Makes the cat say something. Example: 'cowsay hello world'.<br>
<span class="output">stats</span> - Displays session and global stats.<br>
<span class="output">message <i>text</i></span> - Copies your message and opens the guestbook. Example: 'message hey!'.<br>
<span class="output">clear</span> - Clears the terminal screen.<br>
<span class="output">whoami</span> - Displays current user.<br>
<span class="output">tree</span> - Displays directory tree.<br>
<span class="output">help</span> - Displays the list of commands.<br>
<span class="output">su...</span> - Nevermind haha...<br>`;
        }
      };

      // Confort d'usage : calcule la meilleure complétion possible pour la
      // valeur actuelle (une commande, ou un argument de commande connue).
      // Retourne la chaîne complète suggérée, ou "" si rien ne correspond.
      function bestMatch(value) {
        if (!value) return "";
        const parts = value.split(" ");
        const cmd = parts[0];

        if (parts.length === 1) {
          const m = commandsList.find(c => c.startsWith(cmd) && c !== cmd);
          return m || "";
        }

        if (commandsList.includes(cmd)) {
          const arg = parts[1] || "";
          const allDirs = rootMode ? [...directories, "secret"] : directories;
          const pool = [...allDirs, ...files];
          const m = pool.find(item => item.startsWith(arg) && item !== arg);
          if (m) return `${cmd} ${m}`;
        }

        return "";
      }

      // Gestion des commandes
      commandInput.addEventListener("keydown", (e) => {
        if (!introDone) return;
        
        // Historique avec flèches
        if (e.key === "ArrowUp") {
          e.preventDefault();
          if (commandHistory.length > 0) {
            if (historyIndex === -1) {
              historyIndex = commandHistory.length - 1;
            } else if (historyIndex > 0) {
              historyIndex--;
            }
            commandInput.value = commandHistory[historyIndex];
          }
        } else if (e.key === "ArrowDown") {
          e.preventDefault();
          if (historyIndex !== -1) {
            if (historyIndex < commandHistory.length - 1) {
              historyIndex++;
              commandInput.value = commandHistory[historyIndex];
            } else {
              historyIndex = -1;
              commandInput.value = "";
            }
          }
        } else if (e.key === "Enter") {
          const command = commandInput.value.trim();
          if (command) {
            commandHistory.push(command);
            historyIndex = -1;
            commandsRun++;
          }
          commandInput.value = "";
          ghost.textContent = "";
          const p = rootMode ? "Terminal@root:~# ☠" : "Terminal@guest:~#";
          // FIX XSS : la commande tapée par l'utilisateur est échappée
          // avant d'être injectée dans le HTML.
          output.innerHTML += `<span class="prompt">${escapeHTML(p)} </span><span class="command">${escapeHTML(command)}</span><br>`;
          executeCommand(command);
        } else if (e.key === "ArrowRight") {
          // Accepte la suggestion ghost si le curseur est en fin de saisie.
          const value = commandInput.value;
          const match = bestMatch(value);
          const atEnd = commandInput.selectionStart === value.length;
          if (atEnd && match && match.length > value.length) {
            e.preventDefault();
            commandInput.value = match;
            ghost.textContent = "";
          }
        } else if (e.key === "Tab") {
          e.preventDefault();
          autocomplete(commandInput);
        }
      });

      // Confort d'usage : suggestion "ghost text" intégrée à la ligne de
      // saisie (comme fish/zsh-autosuggestions) plutôt qu'une liste séparée.
      // Ne force rien : Tab et Enter gardent leur comportement habituel,
      // la flèche droite accepte la suggestion affichée.
      commandInput.addEventListener("input", () => {
        if (!introDone) {
          ghost.textContent = "";
          return;
        }
        const value = commandInput.value;
        const match = bestMatch(value);
        ghost.textContent = (match && match.length > value.length) ? match : "";
      });

      function executeCommand(command) {
        const args = command.split(" ");
        const cmd = args[0];
      
        if (awaitingSecretAnswer) {
          const answer = command.toLowerCase();
          if (answer === "cat") {
            // Effet glitch
            terminal.classList.add("glitch");
            setTimeout(() => terminal.classList.remove("glitch"), 300);
            
            rootMode = true;
            awaitingSecretAnswer = false;
            startParticles();
          
            terminal.style.border = "2px solid red";
            terminal.style.boxShadow = "0 0 15px red";
            document.body.style.backgroundColor = "#200";
          
            document.getElementById("baseprompt").textContent = "Terminal@root:~# ☠ ";
          
            output.innerHTML += `<span class="output">[ Root mode activated ]</span><br><br>`;
          } else {
            awaitingSecretAnswer = false;
            output.innerHTML += `<span class="output">[ Access denied ]</span><br><br>`;
          }
          setTimeout(() => {
            output.scrollTop = output.scrollHeight;
          }, 50);
          return;
        }
      
        if (cmd === "sudo" && args[1] === "su") {
          awaitingSecretAnswer = true;
          output.innerHTML += `<span class="output">[ Authentication required ]<br><br>Solve the riddle :

I walk around with silent grace,
I rule your home, I own your space.
I look at you with calm disdain,
Yet cry for food like I'm in pain.

I scream at night, it so much fun,
Then sleep all day beneath the sun.
I stare at walls, I scratch your chair,
And leave you fur just everywhere.

I zoom around like I'm possessed,
Then take a nap right on your chest.
You bought me toys? That's pretty sweet.
But cardboard boxes can't be beat.

Who am i?
</span><br>`;
          setTimeout(() => {
            output.scrollTop = output.scrollHeight;
          }, 50);
          return;
        }
      
        if (commands[cmd]) {
          const result = commands[cmd](args.slice(1));
          if (result) output.innerHTML += `<span class="output">${result}</span><br><br>`;
        } else {
          // FIX XSS : cmd vient de l'utilisateur, il faut l'échapper
          // avant de le réafficher dans le message d'erreur.
          output.innerHTML += `<span class="output">Unknown command: ${escapeHTML(cmd)}</span><br><br>`;
        }
      
        setTimeout(() => {
          output.scrollTop = output.scrollHeight;
        }, 50);
      }
      
      function autocomplete(input) {
        const value = input.value.trim();
        if (!value) return;
      
        const parts = value.split(" ");
        const cmd = parts[0];
        const arg = parts[1] || "";
      
        if (parts.length === 1) {
          const matches = commandsList.filter(c => c.startsWith(cmd));
          if (matches.length === 1) {
            input.value = matches[0] + " ";
          } else if (matches.length > 1) {
            // Ces suggestions viennent d'une liste fixe (commandsList),
            // donc sûres, mais on échappe par cohérence/défense en profondeur.
            output.innerHTML += `<span class="output">${escapeHTML(matches.join("  "))}</span><br><br>`;
          }
        } else if (commandsList.includes(cmd)) {
          const matches = [...directories, ...files].filter(item => item.startsWith(arg));
          if (matches.length === 1) {
            input.value = cmd + " " + matches[0] + " ";
          } else if (matches.length > 1) {
            output.innerHTML += `<span class="output">${escapeHTML(matches.join("  "))}</span><br><br>`;
          }
        }
      
        setTimeout(() => {
          output.scrollTop = output.scrollHeight;
        }, 50);
      }
    });
  </script>
</body>
</html>
